<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Interactive Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body id="top" class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top page-header shadow">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="#">JS Dashboard</a>
        </div>
    </nav>

    <main class="container my-5 flex-grow-1">
        <h1 id="mainTitle" class="text-center mb-5 custom-title">Моя інтерактивна панель</h1>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="card h-100 shadow-sm custom-card">
                    <div class="card-body text-center">
                        <h3 id="welcomeText" class="card-title mb-4">Вітаємо, гостю!</h3>
                        <div class="d-grid gap-2">
                            <button id="welcomeBtn" class="btn btn-brown">Змінити привітання</button>
                            <button id="restoreBtn" class="btn btn-outline-brown">Повернути текст</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card h-100 shadow-sm custom-card">
                    <div class="card-body text-center">
                        <h3 class="card-title mb-4">Налаштування оформлення</h3>
                        <div class="d-flex justify-content-center flex-wrap gap-2">
                            <button id="lightBtn" class="btn btn-outline-brown">Світла тема</button>
                            <button id="darkBtn" class="btn btn-dark-custom">Темна тема</button>
                            <button id="colorTitleBtn" class="btn btn-brown">Змінити колір заголовка</button>
                            <button id="customClassBtn" class="btn btn-outline-brown">Перемкнути CSS-клас</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card h-100 shadow-sm custom-card">
                    <div class="card-body text-center">
                        <h3 class="card-title mb-4">Лічильник</h3>
                        <h1 id="counterValue" class="display-1 fw-bold mb-4">0</h1>
                        <div class="d-flex justify-content-center gap-3">
                            <button id="minusBtn" class="btn btn-outline-brown btn-lg">−1</button>
                            <button id="resetBtn" class="btn btn-outline-brown btn-lg">Скинути</button>
                            <button id="plusBtn" class="btn btn-brown btn-lg">+1</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card h-100 shadow-sm custom-card text-center">
                    <img id="productImage" src="images/headphones.jpg" class="card-img-top mx-auto mt-3" alt="Товар" style="width: 150px; height: 150px; object-fit: cover;">
                    <div class="card-body">
                        <h4 id="productName" class="card-title">Apple AirPods Max</h4>
                        <h5 id="productPrice" class="text-brown fw-bold">29999 грн</h5>
                        <p id="description" class="card-text text-muted">Навушники повнорозмірні бездротові Apple AirPods Max Midnight (MWW43ZE/A)</p>
                        
                        <div class="d-grid gap-2 mt-3">
                            <button id="changeProductBtn" class="btn btn-brown">Змінити товар</button>
                            <button id="toggleDescBtn" class="btn btn-outline-brown">Показати / приховати опис</button>
                            <button id="changePriceBtn" class="btn btn-outline-brown">Змінити ціну</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <section class="mt-5 p-4 bg-white rounded-4 shadow-sm text-center custom-card">
            <h2 class="mb-4 custom-title">Моя фотогалерея</h2>
            
            <div class="mb-3">
                <img id="galleryImage" src="images/photo1.jpg" class="img-fluid rounded shadow transition-image" alt="Галерея" style="max-height: 400px; object-fit: cover;">
            </div>
            
            <h4 id="galleryTitle" class="mb-2">Фотографія 1</h4>
            <p id="galleryCounter" class="text-muted fw-bold">1 / 4</p>
            
            <div class="d-flex justify-content-center gap-3 mt-3">
                <button id="prevBtn" class="btn btn-brown btn-lg">Назад</button>
                <button id="toggleSizeBtn" class="btn btn-outline-brown btn-lg">Змінити розмір</button>
                <button id="nextBtn" class="btn btn-brown btn-lg">Вперед</button>
            </div>
        </section>

    </main>

    <footer class="page-header py-4 text-center mt-auto">
        <div class="container text-white">
            <p class="mb-0 fs-5">© 2026 Діана Гаврилюк</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
